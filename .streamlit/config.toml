[server]
maxUploadSize = 1000

# "minimal" hides the viewer menu's Settings / theme switcher. The app has one
# deliberately designed theme; ui_style.py is written against exactly these
# colours, so letting a viewer flip Streamlit to its stock light theme would
# put light widgets under the dark styling (which is what happened in v7.3's
# first visual refresh).
[client]
toolbarMode = "minimal"

# "Midnight lab": the single theme. Keep in step with PALETTE in ui_style.py.
[theme]
base = "dark"
primaryColor = "#6D8CFF"
backgroundColor = "#090D18"
secondaryBackgroundColor = "#121A2C"
textColor = "#E7EBF4"
linkColor = "#8FA8FF"
borderColor = "#222C45"
dataframeHeaderBackgroundColor = "#141C30"
font = "'Inter', 'Segoe UI', system-ui, sans-serif"
headingFont = "'Space Grotesk', 'Inter', 'Segoe UI', sans-serif"
headingFontWeights = [700, 650, 600]
baseRadius = "0.7rem"
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#0C1222"
secondaryBackgroundColor = "#141C30"
borderColor = "#222C45"
