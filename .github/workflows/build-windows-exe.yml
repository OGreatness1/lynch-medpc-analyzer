name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed `
          --name "Lynch MedPC Analyzer" `
          --copy-metadata streamlit `
          --collect-submodules plotly `
          --hidden-import plotly `
          --hidden-import plotly.express `
          --hidden-import plotly.graph_objects `
          --hidden-import plotly.io `
          --hidden-import plotly.subplots `
          --hidden-import streamlit `
          --hidden-import streamlit.runtime.scriptrunner_utils `
          --hidden-import importlib.metadata `
          --add-data "analyzer.py;." `
          --add-data "config.py;." `
          --add-data "parser.py;." `
          --add-data "plotter.py;." `
          --add-data "utils.py;." `
          app.py

    - name: Upload Windows EXE artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: lynch-medpc-windows-exe
        path: dist/Lynch MedPC Analyzer.exe
        retention-days: 3
